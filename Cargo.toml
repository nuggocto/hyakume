[package]
name = "hyakume"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Pass files, text, and links between your own devices"
repository = "https://github.com/nuggocto/hyakume"
publish = false

[dependencies]
# aes, cbc, and crypto-bigint run the Secret Service session (src/secrets.rs)
# in versions already used elsewhere in the tree.
aes = "0.8.4"
# The passphrase-encrypted key file (src/secrets.rs).
age = { version = "0.12.1", default-features = false }
blake3 = "1.8"
cbc = { version = "0.1.2", features = ["alloc", "zeroize"] }
clap = { version = "4.6", features = ["derive", "env"] }
crypto-bigint = { version = "0.5.5", default-features = false, features = ["zeroize"] }
# The same version spake2 0.4.0 uses, to check peer shares (src/pairing.rs).
curve25519-dalek = { version = "4.1", default-features = false }
data-encoding = "2.11"
# hkdf and sha2 in the versions spake2 0.4.0 uses: they publish its scalars
# (tests/vectors.rs) and derive the Secret Service session key
# (src/secrets.rs).
hkdf = "0.12"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "process", "termios"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
spake2 = "=0.4.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
unicode-width = "0.2"
zeroize = "1.9"
# The Secret Service, called directly so no prompt is ever run.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
proptest = "1.12"
rand_chacha = "0.3"
# A stand-in Secret Service on a private connection (src/secrets.rs).
zbus = { version = "5.19", default-features = false, features = ["p2p", "tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"

# The key file's scrypt runs for seconds per unlock without optimization,
# which makes tests and debug builds that open key files unusably slow.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
