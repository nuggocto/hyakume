name: CI

# The same checks as `mise run ci`: format, Clippy with warnings as errors,
# and every test, on the toolchain pinned in rust-toolchain.toml.
on:
  push:
    branches: [shrek]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Headers GPUI links against for Wayland, X11, and fonts. Nothing opens a
      # window in CI; the desktop crate only has to build and run its tests.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev

      # rust-cache hashes every installed toolchain into its key, so the
      # runner image's own Rust going 1.99.0 to 1.99.1 threw the cache away.
      # Keeping only the pinned one makes the key follow rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          pinned=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup toolchain list --quiet | grep -vxF "$pinned" | xargs -r -n1 rustup toolchain uninstall
          rustup toolchain list

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
