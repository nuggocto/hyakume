name: CI

on:
  push:
    branches: [shrek]
  pull_request:
    branches: [shrek]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up mise and Rust
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.7"
          install_args: rust
          cache: false

      - name: Run checks
        run: mise run ci

  linux-package:
    name: Linux package and key stores
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up mise and Rust
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: "2026.10.7"
          install_args: rust
          cache: false

      - name: Install an isolated keyring
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus-bin dbus-daemon gnome-keyring libsecret-tools

      - name: Secret Service store
        run: mise run test-keyring

      - name: Full disks
        # Ubuntu restricts unprivileged user namespaces; the test mounts its
        # small filesystems in one.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mise run test-full-disk

      - name: Build the package
        run: mise run package

      - name: Qualify the package on a clean host
        run: mise run qualify
