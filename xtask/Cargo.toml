[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Hyakume's project tasks: building and qualifying packages"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
