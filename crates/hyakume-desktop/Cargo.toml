[package]
name = "hyakume-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
hyakume-client = { path = "../hyakume-client" }
hyakume-core = { path = "../hyakume-core" }
hyakume-storage = { path = "../hyakume-storage" }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
unicode-segmentation = "1.13.3"
uuid = "1.29.0"

[lints]
workspace = true
