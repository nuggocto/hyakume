[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tasks.fmt]
description = "Format Rust code"
# The fuzz targets are a separate package, so cargo fmt does not reach them.
run = [
  "cargo fmt --all",
  "rustfmt --edition 2024 fuzz/fuzz_targets/*.rs",
]

[tasks.fmt-check]
description = "Check Rust formatting"
run = [
  "cargo fmt --all -- --check",
  "rustfmt --check --edition 2024 fuzz/fuzz_targets/*.rs",
]

[tasks.lint]
description = "Run Clippy with warnings treated as errors"
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks.check]
description = "Check all Rust targets without building binaries"
run = "cargo check --locked --all-targets"

[tasks.test]
description = "Run Rust tests"
run = "cargo test --locked"

[tasks.build]
description = "Build the application"
run = "cargo build --locked"

[tasks.ci]
description = "Run the CI checks in order"
run = [
  "mise run fmt-check",
  "mise run lint",
  "mise run test",
  "mise run build",
]

[tasks.test-keyring]
description = "Run the Secret Service test in an isolated keyring (needs dbus-run-session, gnome-keyring-daemon, and secret-tool)"
run = "cargo test --locked --test service -- --ignored --exact a_secret_service_key_unlocks_at_start_and_is_deleted_on_reset"

[tasks.test-full-disk]
description = "Run the full-disk test on small filesystems (needs unprivileged user namespaces)"
run = "cargo test --locked --test service -- --ignored --exact a_full_disk_refuses_offers_and_input_and_leaves_nothing_behind"

[tasks.deny]
description = "Check dependency licenses, sources, and advisories (needs cargo-deny)"
run = "cargo deny check"

[tasks.fuzz]
description = "Run each fuzz target for 120 seconds (needs cargo-fuzz and nightly-2026-09-04)"
run = [
  "cargo +nightly-2026-09-04 fuzz run frame -- -max_total_time=120 -max_len=65536 -rss_limit_mb=1024 -timeout=5",
  "cargo +nightly-2026-09-04 fuzz run invitation_token -- -max_total_time=120 -max_len=65536 -rss_limit_mb=1024 -timeout=5",
  "cargo +nightly-2026-09-04 fuzz run ipc_message -- -max_total_time=120 -max_len=65536 -rss_limit_mb=1024 -timeout=5",
  "cargo +nightly-2026-09-04 fuzz run stored_values -- -max_total_time=120 -max_len=65536 -rss_limit_mb=1024 -timeout=5",
]
