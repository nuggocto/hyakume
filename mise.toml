[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tasks.dev]
description = "Build the CLI and desktop app, then open the desktop app through the launcher"
run = "cargo build --locked -p hyakume-cli -p hyakume-desktop && ./target/debug/hyakume"

[tasks.servers]
description = "Build everything, then run both dev servers until Ctrl+C"
shell = "bash -c"
run = '''
set -e
cargo build --locked -p hyakume-server -p hyakume-cli -p hyakume-desktop
trap 'kill $(jobs -p) 2>/dev/null' EXIT
./target/debug/hyakume-server --config dev/server-a.toml &
./target/debug/hyakume-server --config dev/server-b.toml &
# If either server stops (a port in use, a bad config), stop the other too.
wait -n
'''

[tasks.demo-setup]
description = "Create the Alice, Bob, and Gwen profiles and sign them in (needs `mise run servers`)"
run = '''
set -e
cargo build -q --locked -p hyakume-cli
rm -rf dev/data/profiles
for who in alice bob gwen; do
  dir="dev/data/profiles/$who"
  mkdir -p "$dir"
  # Plain token files instead of the OS keyring, so test sign-ins stay in dev/data.
  echo 'credential_store = "dev-file"' > "$dir/client.toml"
done
as() { who=$1; shift; HYAKUME_DATA_DIR="dev/data/profiles/$who" ./target/debug/hyakume "$@"; }
as alice server add a http://127.0.0.1:7878
as alice auth dev-login alice --server a \
  || { echo "Is \`mise run servers\` running in another terminal?" >&2; exit 1; }
as alice server add b http://127.0.0.1:7879
as alice auth dev-login alice --server b
as alice workspace use a/acme
as bob server add a http://127.0.0.1:7878
as bob auth dev-login bob --server a
as bob server add b http://127.0.0.1:7879
as bob auth dev-login bob --server b
as bob workspace use a/acme
as gwen server add a http://127.0.0.1:7878
as gwen auth dev-login gwen --server a
as gwen workspace use a/acme
echo
echo "Ready. Try: mise run alice -- task list"
'''

[tasks.demo-data]
description = "Fill the demo with the mockup's tasks and links, plus a 150-task workspace (after `mise run demo-setup`)"
run = '''
set -e
cargo build -q --locked -p hyakume-cli
as() { who=$1; shift; HYAKUME_DATA_DIR="dev/data/profiles/$who" ./target/debug/hyakume "$@" > /dev/null; }
# Alice's personal work, on her computer only.
as alice -w local project create HOME Home
as alice -w local task create --project HOME "Fix bike" --stage "To do"
as alice -w local task create --project HOME "Book dentist"
as alice -w local task create --project HOME "Renew passport" --stage Done
# Acme on server a, shared by Alice, Bob, and Gwen.
as alice task create --project WEB "Landing page" --stage "In progress" --assignee bob \
  --label marketing --label launch --priority high --due 2026-11-14 \
  --description "Hero, pricing teaser, and the signup form. The form needs the signup endpoint first."
as alice task create --project WEB "Pricing table" --stage "To do"
as alice task create --project WEB "Footer links" --stage Done
as alice task create --project WEB "Hero illustration" --stage Review
as alice task create --project WEB "Cookie banner"
as alice task create --project WEB "404 page"
as alice task create --project API "Signup endpoint" --stage Review --assignee alice
as alice task create --project API "Rate limits" --stage "To do"
as alice task create --project API "Auth tokens" --stage "In progress"
as alice relation create API-1 blocks WEB-1
as alice relation create WEB-1 blocks WEB-2
as alice relation create WEB-4 related_to WEB-1
as alice relation create API-3 related_to API-2
as alice task comment WEB-1 "Copy is final. Waiting on the endpoint."
as bob task comment WEB-1 "Layout is done, wiring the form next."
# Studio on server b.
as bob -w b/studio task create --project DOC "Install guide" --stage "In progress"
as bob -w b/studio task create --project DOC "API reference" --stage "To do"
as bob -w b/studio task create --project DOC "Changelog" --stage Done
# A workspace the size of a real team's tracker, also on server b.
cargo run -q --locked -p hyakume-cli --example scale_data
echo "Demo data ready. Open the app with: mise run alice"
'''

[tasks.alice]
description = "Run a hyakume command as Alice, e.g. `mise run alice -- task list`"
quiet = true
run = "cargo build -q --locked -p hyakume-cli && HYAKUME_DATA_DIR=dev/data/profiles/alice ./target/debug/hyakume"

[tasks.bob]
description = "Run a hyakume command as Bob"
quiet = true
run = "cargo build -q --locked -p hyakume-cli && HYAKUME_DATA_DIR=dev/data/profiles/bob ./target/debug/hyakume"

[tasks.gwen]
description = "Run a hyakume command as Gwen, a guest who only sees WEB"
quiet = true
run = "cargo build -q --locked -p hyakume-cli && HYAKUME_DATA_DIR=dev/data/profiles/gwen ./target/debug/hyakume"

[tasks.lan-servers]
description = "Run both dev servers for another computer on the network until Ctrl+C, e.g. `mise run lan-servers 192.168.1.42`"
shell = "bash -c"
usage = 'arg "<peer>" help="Address of the other computer, the only one the firewall lets in"'
run = '''
set -e
cargo build --locked -p hyakume-server -p hyakume-cli -p hyakume-desktop
peer="$usage_peer"
# Dev login lets anyone who reaches the ports sign in as anyone, so the
# firewall opens them to the one test computer and closes them on exit.
rule=(allow from "$peer" to any port 7878:7879 proto tcp)
sudo ufw "${rule[@]}"
trap 'kill $(jobs -p) 2>/dev/null; sudo ufw delete "${rule[@]}"' EXIT
export HYAKUME_SERVER_DEV_ALLOW_REMOTE=true
HYAKUME_SERVER_BIND=0.0.0.0:7878 ./target/debug/hyakume-server --config dev/server-a.toml &
HYAKUME_SERVER_BIND=0.0.0.0:7879 ./target/debug/hyakume-server --config dev/server-b.toml &
echo "On $peer, run: mise run lan-profile bob $(ip -4 route get "$peer" | grep -o 'src [0-9.]*' | cut -d' ' -f2)"
# If either server stops (a port in use, a bad config), stop the other too.
wait -n
'''

[tasks.lan-profile]
description = "Sign a test person in to the dev servers on another computer, e.g. `mise run lan-profile bob 192.168.1.95`"
usage = '''
arg "<who>" help="alice, bob, or gwen" {
  choices "alice" "bob" "gwen"
}
arg "[server]" help="Address of the computer running `mise run lan-servers`" default="127.0.0.1"
'''
run = '''
set -e
cargo build -q --locked -p hyakume-cli -p hyakume-desktop
who="$usage_who"
dir="dev/data/profiles/$who"
rm -rf "$dir"
mkdir -p "$dir"
echo 'credential_store = "dev-file"' > "$dir/client.toml"
as() { HYAKUME_DATA_DIR="$dir" ./target/debug/hyakume "$@"; }
as server add a "http://$usage_server:7878"
as auth dev-login "$who" --server a \
  || { echo "Can't sign in. Is \`mise run lan-servers\` running on $usage_server?" >&2; exit 1; }
# Gwen is a guest on server a only.
if [ "$who" != gwen ]; then
  as server add b "http://$usage_server:7879"
  as auth dev-login "$who" --server b
fi
as workspace use a/acme
echo "Ready. Open the app with: mise run $who"
'''

[tasks.reset]
description = "Delete the dev server databases and profiles (stop `mise run servers` first)"
run = "rm -rf dev/data"

[tasks.build]
description = "Build all workspace packages"
run = "cargo build --workspace --locked"

[tasks.build-release]
description = "Build all workspace packages in release mode"
run = "cargo build --workspace --release --locked"

[tasks.check]
description = "Check all workspace targets"
run = "cargo check --workspace --all-targets --locked"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check workspace formatting without changing files"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint all workspace targets"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run workspace tests and doctests"
run = "cargo test --workspace --locked"

[tasks.ci]
description = "Run formatting, lint, and test checks"
depends = ["fmt-check", "lint", "test"]
