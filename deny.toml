# Dependency checks: `cargo deny check`.
# Licenses must be compatible with Apache-2.0. Where a crate offers a choice,
# cargo-deny accepts it when any offered license is allowed here.

[graph]
# The v1 platforms.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Iroh's graph carries several major versions of some crates.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
ignore = [
    # paste is unmaintained. It is a compile-time macro crate reached only
    # through iroh 1.3.0 -> netwatch -> netlink-packet-core, with no known
    # vulnerability and no upgrade available within iroh 1.3.0. Recheck when
    # Iroh is upgraded.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained macro crate inside iroh's graph; no vulnerability" },
]
